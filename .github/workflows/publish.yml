name: Publish Spanish course

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Что проверить"
        required: true
        type: choice
        options: [morning, practice, check]
        default: check
      day:
        description: "Номер дня 1–30 (для тестовой публикации)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: spanish-course-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check media files
        if: github.event_name == 'workflow_dispatch' && inputs.slot == 'check'
        run: node src/check-files.mjs

      - name: Publish scheduled lesson
        if: github.event_name == 'schedule'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          START_DATE: ${{ vars.START_DATE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: node src/publish.mjs

      - name: Test one lesson
        if: github.event_name == 'workflow_dispatch' && inputs.slot != 'check'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          MANUAL_DAY: ${{ inputs.day }}
          MANUAL_SLOT: ${{ inputs.slot }}
          TEST_MODE: "true"
        run: node src/publish.mjs

      - name: Save publication state
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet -- data/state.json; then
            echo "Изменений состояния нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Save Spanish course publication state"
          git pull --rebase
          git push
