name: Publish Spanish course

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Moscow"
    - cron: "0 12 * * *"
      timezone: "Europe/Moscow"
    - cron: "0 14 * * *"
      timezone: "Europe/Moscow"
    - cron: "0 16 * * *"
      timezone: "Europe/Moscow"

  workflow_dispatch:
    inputs:
      slot:
        description: "Что опубликовать или проверить"
        required: true
        type: choice
        options: [morning, practice, monthly_polls, congrats, check]
        default: check
      mode:
        description: "official — настоящая публикация; test — проверка без записи состояния"
        required: true
        type: choice
        options: [official, test]
        default: official
      day:
        description: "Номер дня. 0 = сегодняшний календарный день"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: spanish-course-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check course files
        if: github.event_name == 'workflow_dispatch' && inputs.slot == 'check'
        run: node src/check-files.mjs

      - name: Validate settings
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slot != 'check')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          START_DATE: ${{ vars.START_DATE }}
        run: |
          test -n "$BOT_TOKEN" || (echo "ОШИБКА: нет BOT_TOKEN" && exit 1)
          test -n "$CHANNEL_ID" || (echo "ОШИБКА: нет CHANNEL_ID" && exit 1)
          test -n "$START_DATE" || (echo "ОШИБКА: нет START_DATE" && exit 1)

      - name: Publish scheduled content
        if: github.event_name == 'schedule'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          START_DATE: ${{ vars.START_DATE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          RUN_MODE: official
          EVENT_TYPE: schedule
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node src/publish.mjs

      - name: Publish manually
        if: github.event_name == 'workflow_dispatch' && inputs.slot != 'check'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          START_DATE: ${{ vars.START_DATE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          MANUAL_DAY: ${{ inputs.day }}
          MANUAL_SLOT: ${{ inputs.slot }}
          RUN_MODE: ${{ inputs.mode }}
          EVENT_TYPE: manual
        run: node src/publish.mjs

      - name: Save publication state
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slot != 'check' && inputs.mode == 'official'))
        run: |
          if git diff --quiet -- data/state.json; then
            echo "Изменений состояния нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Save Spanish course publication state"
          git pull --rebase
          git push
