name: Publish Spanish course

on:
  schedule:
    # Три попытки утренней публикации по московскому времени.
    - cron: "7,27,47 7 * * *"
      timezone: "Europe/Moscow"
    # Три попытки дневной публикации по московскому времени.
    - cron: "7,27,47 14 * * *"
      timezone: "Europe/Moscow"

  workflow_dispatch:
    inputs:
      slot:
        description: "Что проверить"
        required: true
        type: choice
        options: [morning, practice, check]
        default: check
      day:
        description: "Номер дня 1–30 (для тестовой публикации)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: spanish-course-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check media and lesson files
        if: github.event_name == 'workflow_dispatch' && inputs.slot == 'check'
        run: node src/check-files.mjs

      - name: Validate required scheduled settings
        if: github.event_name == 'schedule'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          START_DATE: ${{ vars.START_DATE }}
        run: |
          test -n "$BOT_TOKEN" || (echo "ОШИБКА: не задан Secret BOT_TOKEN" && exit 1)
          test -n "$CHANNEL_ID" || (echo "ОШИБКА: не задан Secret CHANNEL_ID" && exit 1)
          test -n "$START_DATE" || (echo "ОШИБКА: не задана Variable START_DATE" && exit 1)

      - name: Publish scheduled lesson
        if: github.event_name == 'schedule'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          START_DATE: ${{ vars.START_DATE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          SCHEDULE_SLOT: ${{ github.event.schedule == '7,27,47 7 * * *' && 'morning' || 'practice' }}
        run: node src/publish.mjs

      - name: Validate test settings
        if: github.event_name == 'workflow_dispatch' && inputs.slot != 'check'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          test -n "$BOT_TOKEN" || (echo "ОШИБКА: не задан Secret BOT_TOKEN" && exit 1)
          test -n "$CHANNEL_ID" || (echo "ОШИБКА: не задан Secret CHANNEL_ID" && exit 1)

      - name: Test one lesson
        if: github.event_name == 'workflow_dispatch' && inputs.slot != 'check'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          MANUAL_DAY: ${{ inputs.day }}
          MANUAL_SLOT: ${{ inputs.slot }}
          TEST_MODE: "true"
        run: node src/publish.mjs

      - name: Save publication state
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet -- data/state.json; then
            echo "Изменений состояния нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Save Spanish course publication state"
          git pull --rebase
          git push
